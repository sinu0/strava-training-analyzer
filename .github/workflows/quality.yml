name: Full-stack quality
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: docker build -t stravaanalizator-db:latest db
      - run: ./gradlew test integrationTest
        working-directory: backend
      - run: npm ci && npm run api:check && npm run quality
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: docker compose -f docker-compose.test.yml up -d --build --wait
      - run: npm run test:e2e:real
        working-directory: frontend
      - run: bash scripts/check-lan-access.sh
        env:
          TEST_FRONTEND_IMAGE: strava-coherence-test-frontend
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence
          path: |
            backend/build/reports/tests
            backend/build/openapi.json
            frontend/test-results
      - if: always()
        run: docker compose -f docker-compose.test.yml down -v
